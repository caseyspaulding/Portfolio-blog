<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Legacy System Modernization Architecture
  </text>
  
  <!-- Before/After Labels -->
  <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
    BEFORE (Legacy)
  </text>
  <text x="750" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    AFTER (Modernized)
  </text>
  
  <!-- Legacy Architecture (Left Side) -->
  <!-- Web Browser -->
  <rect x="50" y="100" width="200" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="150" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Web Browser
  </text>
  
  <!-- ASP.NET WebForms -->
  <rect x="50" y="200" width="200" height="80" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="150" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    ASP.NET WebForms
  </text>
  <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Presentation Layer
  </text>
  <text x="150" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Business Logic
  </text>
  
  <!-- Direct Database Access -->
  <rect x="50" y="320" width="200" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="150" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Direct SQL Access
  </text>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    ADO.NET / Stored Procs
  </text>
  
  <!-- Legacy Database -->
  <rect x="50" y="420" width="200" height="80" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    SQL Server Database
  </text>
  <text x="150" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Transaction Details
  </text>
  <text x="150" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Customer Data
  </text>
  
  <!-- Modern Architecture (Right Side) -->
  <!-- Web Browser -->
  <rect x="650" y="100" width="200" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="750" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Web Browser
  </text>
  
  <!-- Refactored WebForms -->
  <rect x="650" y="200" width="200" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="750" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Refactored WebForms
  </text>
  <text x="750" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Presentation Layer Only
  </text>
  
  <!-- API Gateway/Load Balancer -->
  <rect x="650" y="300" width="200" height="40" fill="#16a085" stroke="#1abc9c" stroke-width="2" rx="5"/>
  <text x="750" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    API Gateway
  </text>
  
  <!-- Serverless API -->
  <rect x="650" y="370" width="200" height="80" fill="#27ae60" stroke="#2ecc71" stroke-width="2" rx="5"/>
  <text x="750" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    .NET Core API
  </text>
  <text x="750" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    AWS Lambda
  </text>
  <text x="750" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Entity Framework Core
  </text>
  
  <!-- Modern Database -->
  <rect x="650" y="480" width="200" height="80" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="750" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    SQL Server Database
  </text>
  <text x="750" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Optimized Indexes
  </text>
  <text x="750" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Audit Tables
  </text>
  
  <!-- API Endpoints Box -->
  <rect x="450" y="320" width="160" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="530" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    API Endpoints
  </text>
  <text x="460" y="360" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /api/reports/search
  </text>
  <text x="460" y="380" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /api/customer/{id}
  </text>
  <text x="460" y="400" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    POST /api/transactions
  </text>
  <text x="460" y="420" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /api/lookup/states
  </text>
  <text x="460" y="440" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /api/lookup/types
  </text>
  <text x="460" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /health
  </text>
  <text x="460" y="480" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    GET /ping
  </text>
  
  <!-- Arrows for Legacy -->
  <path d="M 150 160 L 150 200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 150 280 L 150 320" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 150 380 L 150 420" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows for Modern -->
  <path d="M 750 160 L 750 200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 750 260 L 750 300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 750 340 L 750 370" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 750 450 L 750 480" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- HTTP Arrows -->
  <path d="M 650 410 L 610 410" stroke="#e67e22" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="630" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">
    HTTP/REST
  </text>
  
  <!-- Migration Arrow -->
  <path d="M 300 280 L 600 280" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead)" stroke-dasharray="10,5"/>
  <text x="450" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    MIGRATION
  </text>
  
  <!-- Benefits Box -->
  <rect x="50" y="580" width="800" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="450" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Migration Benefits
  </text>
  <text x="60" y="630" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • <tspan font-weight="bold">Scalability:</tspan> Auto-scaling Lambda functions handle load spikes
  </text>
  <text x="60" y="650" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • <tspan font-weight="bold">Maintainability:</tspan> Clean separation of concerns, testable API endpoints
  </text>
  <text x="450" y="630" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • <tspan font-weight="bold">Performance:</tspan> 40% reduction in database connection overhead
  </text>
  <text x="450" y="650" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    • <tspan font-weight="bold">Security:</tspan> Centralized data access with consistent policies
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Technology Stack Labels -->
  <text x="150" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7f8c8d">
    Technologies: ASP.NET WebForms, ADO.NET, SQL Server
  </text>
  <text x="750" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7f8c8d">
    Technologies: .NET Core, AWS Lambda, EF Core, REST APIs
  </text>
</svg>