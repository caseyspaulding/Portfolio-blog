<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Enterprise Customer Management System - Modernization
  </text>
  
  <!-- Legacy Architecture Box -->
  <rect x="50" y="60" width="350" height="400" fill="#ffebee" stroke="#e57373" stroke-width="3" rx="10"/>
  <text x="225" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">
    LEGACY ARCHITECTURE
  </text>
  
  <!-- Legacy WebForms -->
  <rect x="80" y="110" width="290" height="80" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
  <text x="225" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    ASP.NET WebForms
  </text>
  <text x="225" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Reports.aspx
  </text>
  <text x="225" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    TransactionDetails.cs
  </text>
  
  <!-- Direct SQL Arrow -->
  <path d="M 225 195 L 225 230" stroke="#e53935" stroke-width="3" marker-end="url(#redArrow)"/>
  <text x="270" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e53935">
    Direct SQL
  </text>
  
  <!-- Legacy Database -->
  <rect x="80" y="240" width="290" height="100" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
  <text x="225" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    SQL Server Database
  </text>
  <text x="225" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    CustomerAudit
  </text>
  <text x="225" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    transaction_details
  </text>
  <text x="225" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    d_transaction_type
  </text>
  
  <!-- Legacy Issues -->
  <text x="225" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
    Issues:
  </text>
  <text x="225" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">
    • Tight coupling
  </text>
  <text x="225" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">
    • Hard to maintain
  </text>
  <text x="225" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#424242">
    • No API reusability
  </text>
  
  <!-- Modern Architecture Box -->
  <rect x="500" y="60" width="350" height="400" fill="#e3f2fd" stroke="#42a5f5" stroke-width="3" rx="10"/>
  <text x="675" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
    MODERN ARCHITECTURE
  </text>
  
  <!-- Modern WebForms -->
  <rect x="530" y="110" width="290" height="60" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
  <text x="675" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    ASP.NET WebForms
  </text>
  <text x="675" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    (Refactored to consume APIs)
  </text>
  
  <!-- REST API Arrow -->
  <path d="M 675 175 L 675 200" stroke="#1976d2" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="720" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">
    REST API
  </text>
  
  <!-- API Service -->
  <rect x="530" y="210" width="290" height="80" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
  <text x="675" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    Customer Audit API (.NET Core)
  </text>
  <text x="675" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Customer Linkage Audit Data Service
  </text>
  <text x="675" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    AWS Lambda Serverless
  </text>
  <text x="675" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    OpenAPI/Swagger
  </text>
  
  <!-- Entity Framework Arrow -->
  <path d="M 675 295 L 675 320" stroke="#1976d2" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text x="720" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">
    Entity Framework
  </text>
  
  <!-- Modern Database -->
  <rect x="530" y="330" width="290" height="80" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="5"/>
  <text x="675" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    SQL Server Database
  </text>
  <text x="675" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    CustomerAudit
  </text>
  <text x="675" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    (Same data, better access)
  </text>
  
  <!-- Modern Benefits -->
  <text x="675" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
    Benefits: Scalable • Maintainable • Reusable
  </text>
  
  <!-- Modernize Arrow -->
  <path d="M 400 260 L 500 260" stroke="#4caf50" stroke-width="4" marker-end="url(#greenArrow)" stroke-dasharray="15,10"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">
    MODERNIZE
  </text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4caf50">
    API Decoupling
  </text>
  
  <!-- Technologies Footer -->
  <rect x="50" y="480" width="800" height="60" fill="#f5f5f5" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="450" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Technologies:
  </text>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    .NET Core • Entity Framework • AWS Lambda • SQL Server • OpenAPI/Swagger • ASP.NET WebForms • REST APIs
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="redArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e53935"/>
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1976d2"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#4caf50"/>
    </marker>
  </defs>
</svg>