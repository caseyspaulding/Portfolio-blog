<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="legacyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1" />
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    USDA Customer ID Link Manager - System Modernization
  </text>
  
  <!-- Legacy Section -->
  <g id="legacy-section">
    <!-- Background -->
    <rect x="50" y="70" width="300" height="350" fill="url(#legacyGrad)" stroke="#ef4444" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <!-- Legacy Title -->
    <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">
      LEGACY ARCHITECTURE
    </text>
    
    <!-- WebForms Box -->
    <rect x="80" y="120" width="240" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      ASP.NET WebForms
    </text>
    <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      Reports.aspx
    </text>
    <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      TransactionDetails.cs
    </text>
    
    <!-- Direct Database Access -->
    <line x1="200" y1="180" x2="200" y2="220" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="220" y="205" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">
      Direct SQL
    </text>
    
    <!-- Database Box -->
    <rect x="120" y="240" width="160" height="80" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      SQL Server Database
    </text>
    <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      LinkMgrAudit
    </text>
    <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      tews_scims_transaction_details
    </text>
    <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      d_transaction_type
    </text>
    
    <!-- Issues -->
    <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">
      Issues:
    </text>
    <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f1d1d">
      • Tight coupling
    </text>
    <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f1d1d">
      • Hard to maintain
    </text>
    <text x="200" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f1d1d">
      • No API reusability
    </text>
  </g>
  
  <!-- Arrow pointing right -->
  <g id="transformation-arrow">
    <line x1="370" y1="245" x2="420" y2="245" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="395" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">
      MODERNIZE
    </text>
    <text x="395" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#065f46">
      API Decoupling
    </text>
  </g>
  
  <!-- Modern Section -->
  <g id="modern-section">
    <!-- Background -->
    <rect x="450" y="70" width="300" height="350" fill="url(#modernGrad)" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <!-- Modern Title -->
    <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">
      MODERN ARCHITECTURE
    </text>
    
    <!-- WebForms Box (Updated) -->
    <rect x="480" y="120" width="240" height="50" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      ASP.NET WebForms
    </text>
    <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      (Refactored to consume APIs)
    </text>
    
    <!-- API Call -->
    <line x1="600" y1="170" x2="600" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="620" y="190" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8" font-weight="bold">
      REST API
    </text>
    
    <!-- CLADS API Box -->
    <rect x="480" y="210" width="240" height="70" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      CLADS API (.NET Core)
    </text>
    <text x="600" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      Customer Linkage Audit Data Service
    </text>
    <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      AWS Lambda Serverless
    </text>
    <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      OpenAPI/Swagger
    </text>
    
    <!-- Database Connection -->
    <line x1="600" y1="280" x2="600" y2="310" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="620" y="300" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8" font-weight="bold">
      Entity Framework
    </text>
    
    <!-- Database Box -->
    <rect x="520" y="320" width="160" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1" rx="5"/>
    <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      SQL Server Database
    </text>
    <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      LinkMgrAudit
    </text>
    <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      (Same data, better access)
    </text>
    
    <!-- Benefits -->
    <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">
      Benefits: Scalable • Maintainable • Reusable
    </text>
  </g>
  
  <!-- Key Technologies Box -->
  <rect x="50" y="450" width="700" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="5"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">
    Technologies:
  </text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    .NET Core • Entity Framework • AWS Lambda • SQL Server • OpenAPI/Swagger • ASP.NET WebForms • REST APIs
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>
</svg>